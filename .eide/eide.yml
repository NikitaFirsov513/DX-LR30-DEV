version: "4.1"
name: dx_lr30_pj26
type: ARM
deviceName: STM32F103C8
packDir: null
srcDirs:
  - app
  - board
  - mcu
  - devices
  - vendor
virtualFolder:
  name: <virtual_root>
  files: []
  folders: []
dependenceList: []
outDir: build\eide
miscInfo:
  uid: f12d63965771dc8c1d65e0e1c0a8cd68
targets:
  Radio:
    cppPreprocessAttrs:
      defineList:
        - STM32F103xB
        - HSE_VALUE=8000000
      incList:
        - app
        - board
        - mcu
        - devices/sx126x
        - vendor/semtech
        - vendor/cmsis/Include
        - vendor/cmsis/Device/ST/STM32F1xx/Include
      libList: []
    excludeList: []
    settings: {}
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: -Wextra -Werror -fno-common -Wno-unused-parameter
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-size
            warnings: all-warnings
          global:
            $float-abi-type: soft
            misc-control: []
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes: []
            LD_FLAGS: ""
            LIB_FLAGS: ""
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F103C8TX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      Custom:
        bin: ""
        commandLine: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "tools/flash.ps1" -Firmware "${programFile}"
        eraseChipCommand: ""
    uploader: Custom
  UART:
    cppPreprocessAttrs:
      defineList:
        - STM32F103xB
        - HSE_VALUE=8000000
        - UART_ONLY=1
      incList:
        - app
        - board
        - mcu
        - devices/sx126x
        - vendor/semtech
        - vendor/cmsis/Include
        - vendor/cmsis/Device/ST/STM32F1xx/Include
      libList: []
    excludeList: []
    settings: {}
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M3
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: -Wextra -Werror -fno-common -Wno-unused-parameter
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-size
            warnings: all-warnings
          global:
            $float-abi-type: soft
            misc-control: []
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes: []
            LD_FLAGS: ""
            LIB_FLAGS: ""
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32F103C8TX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      Custom:
        bin: ""
        commandLine: powershell.exe -NoProfile -ExecutionPolicy Bypass -File "tools/flash.ps1" -Firmware "${programFile}"
        eraseChipCommand: ""
    uploader: Custom
